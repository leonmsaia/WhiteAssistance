# WhiteAssistance — Docker Compose
# Phase 2: app, nginx, mysql, redis, mailpit
# Root .env is the single source of truth for Laravel and all services.

services:

  app:
    build:
      context: ./01-app
      dockerfile: Dockerfile
    container_name: whiteassistance-app
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -e /var/www/html/public/storage ]; then
          php /var/www/html/artisan storage:link
        fi
        exec docker-php-entrypoint php-fpm
    volumes:
      - ./01-app:/var/www/html
      - ./.env:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - whiteassistance

  nginx:
    image: nginx:alpine
    container_name: whiteassistance-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./01-app:/var/www/html:ro
      - ./01-app/.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - whiteassistance

  mysql:
    image: mysql:8.4
    container_name: whiteassistance-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./02-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - whiteassistance

  redis:
    image: redis:7-alpine
    container_name: whiteassistance-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - whiteassistance

  mailpit:
    image: axllent/mailpit
    container_name: whiteassistance-mailpit
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - whiteassistance

networks:
  whiteassistance:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
